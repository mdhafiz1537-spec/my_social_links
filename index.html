<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Boss Link in Bio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;cursor:none;}

:root{
  --accent1:#ff7a18;
  --accent2:#32d27a;
  --accent3:#00c3ff;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  color:#fff;
  overflow-y:auto; /* FIXED SCROLL */
}

canvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:-1;
}

/* NEW CURSOR */
.cursor{
  position:fixed;
  width:12px;height:12px;
  border-radius:50%;
  background:#fff;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:999;
}

.cursor-ring{
  position:fixed;
  width:40px;height:40px;
  border:2px solid rgba(255,255,255,0.5);
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:998;
  transition:0.1s ease;
}

.theme-btn{
  position:fixed;
  top:20px;
  right:20px;
  font-size:20px;
  cursor:pointer;
  z-index:10;
}

.container{
  width:340px;
  text-align:center;
  z-index:1;
  padding:40px 0;
}

.profile img{
  width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,255,255,0.6);
}

#typing{
  font-size:14px;
  margin-bottom:20px;
  height:22px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.links{display:flex;flex-direction:column;gap:15px;}

.link{
  padding:15px;border-radius:14px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;text-decoration:none;
  display:flex;align-items:center;gap:12px;
  position:relative;
  overflow:hidden;
  transition:0.3s;
}

.link span{flex:1;text-align:center;}

.link::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  padding:2px;
  background:linear-gradient(270deg,var(--accent1),var(--accent2),var(--accent3),var(--accent1));
  background-size:600% 600%;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:borderMove 6s linear infinite;
}

@keyframes borderMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.link:hover{
  transform:scale(1.07);
  box-shadow:0 0 25px var(--accent2);
}

.footer{margin-top:20px;font-size:12px;color:#aaa;}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="ring"></div>
<div class="theme-btn" id="themeBtn"><i class="fas fa-palette"></i></div>
<canvas id="bg"></canvas>

<div class="container">
  <div class="profile">
    <img src="https://i.pinimg.com/736x/55/61/64/55616463f0895b87b22451133c87ee7d.jpg">
    <h2>Your Limerance </h2>
    <div id="typing"></div>
  </div>

  <div class="links">
    <a href="https://wa.me/8801833594085?text=Just%20a%20small%20hello%20wrapped%20in%20a%20little%20curiosity" class="link"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
    <a href="https://www.instagram.com/seijuro_akashi07?igsh=NWl5ZTB2MWNhZXE4" class="link"><i class="fab fa-instagram"></i><span>Instagram</span></a>
    <a href="https://www.facebook.com/share/1Cvz69RU1W/" class="link"><i class="fab fa-facebook"></i><span>Facebook</span></a>
    <a href="#" class="link"><i class="fab fa-twitter"></i><span>Twitter</span></a>
    <a href="https://github.com/mdhafiz1537-spec" class="link"><i class="fab fa-github"></i><span>GitHub</span></a>
  </div>

  <div class="footer">© 2026 All Right Reserved  Limerance </div>
</div>

<script>
// typing
const text="Life is good thanks to Allah";
let i=0,dir=1;
function type(){
 let el=document.getElementById('typing');
 el.innerHTML=text.substring(0,i);
 i+=dir;
 if(i>text.length||i<0){dir*=-1;}
 setTimeout(type,60);
}
type();

// cursor
const cursor=document.getElementById('cursor');
const ring=document.getElementById('ring');

document.addEventListener('mousemove',e=>{
 cursor.style.left=e.clientX+'px';
 cursor.style.top=e.clientY+'px';

 ring.style.left=e.clientX+'px';
 ring.style.top=e.clientY+'px';
});

// PARTICLE CONNECT BACKGROUND (RESTORED)
const c=document.getElementById('bg');
const ctx=c.getContext('2d');
c.width=innerWidth; c.height=innerHeight;

let p=[];
for(let i=0;i<80;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:Math.random()-0.5,vy:Math.random()-0.5});

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 p.forEach(a=>{
  a.x+=a.vx; a.y+=a.vy;

  if(a.x<0||a.x>c.width)a.vx*=-1;
  if(a.y<0||a.y>c.height)a.vy*=-1;

  ctx.beginPath();
  ctx.arc(a.x,a.y,2,0,Math.PI*2);
  ctx.fillStyle='#32d27a';
  ctx.fill();

  p.forEach(b=>{
   let d=Math.hypot(a.x-b.x,a.y-b.y);
   if(d<100){
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.stroke();
   }
  });
 });

 requestAnimationFrame(draw);
}
draw();

// theme toggle
 document.getElementById('themeBtn').onclick=()=>document.body.classList.toggle('alt');
</script>

</body>
</html>
